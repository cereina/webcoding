name: Refresh security lockfile

on:
  push:
    branches: [security-hardening]

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: security-hardening
      - name: Use Node 22.23.3
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Refresh lockfile for security overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact locked dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build and license checks
        run: npm run build
      - name: Fail on high or critical npm advisories
        run: npm run security:audit
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for security overrides"
          git push origin HEAD:security-hardening
